# Compila el APK de debug de TikRatu con el SDK de Android y lo adjunta como
# asset al release de GitHub que lo disparó. Corre en el runner de GitHub
# porque acá (la máquina donde se escribió el código) no hay Android SDK
# instalado — el build real nunca se probó hasta que corre esto.
#
# También se puede disparar a mano (workflow_dispatch) para probar el build
# sin crear un release; en ese caso el APK queda como artifact descargable
# desde la run, no como asset de un release.

name: Build APK

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Los runners ubuntu-latest de GitHub ya traen el Android SDK
      # preinstalado (ANDROID_HOME/ANDROID_SDK_ROOT), con las licencias
      # aceptadas para las versiones que incluyen. No hace falta un paso
      # extra para instalarlo — se probó primero con android-actions/setup-android@v3
      # y falló porque intenta instalar el paquete legacy "tools", que ya no
      # existe en el repositorio de Google.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/build/outputs/apk/debug/app-debug.apk --clobber

      - name: Upload APK as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tikratu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
