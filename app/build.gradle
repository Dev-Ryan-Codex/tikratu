plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'dev.ryan.tikratu'
    compileSdk 34

    defaultConfig {
        applicationId "dev.ryan.tikratu"
        minSdkVersion 28
        targetSdk 34
        versionCode 4
        versionName '0.4.0'
    }

    // Llave de firma fija: sin esto cada build de CI usa una debug key nueva,
    // lo que obliga a desinstalar antes de instalar y resetea el scope de
    // LSPosed. El keystore vive fuera del repo; CI lo recibe por secretos
    // (TIKRATU_KEYSTORE_B64/PASSWORD/KEY_ALIAS, ver build-apk.yml). Sin las
    // variables de entorno (build local), se usa la debug key normal.
    def fixedKeystore = System.getenv("TIKRATU_KEYSTORE_FILE")
    signingConfigs {
        if (fixedKeystore != null && file(fixedKeystore).exists()) {
            fixed {
                storeFile file(fixedKeystore)
                storePassword System.getenv("TIKRATU_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TIKRATU_KEY_ALIAS")
                keyPassword System.getenv("TIKRATU_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (fixedKeystore != null && file(fixedKeystore).exists()) {
                signingConfig signingConfigs.fixed
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Necesario para que libdexkit.so quede extraído a disco en
    // .../lib/arm64-v8a/ en vez de mapeado dentro del .apk (formato "base.apk!/...")
    // — System.load() con una ruta absoluta (ver Module.java#loadDexKitNativeLibrary)
    // sólo funciona sobre un archivo real en disco, no sobre una ruta dentro del zip.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.dexkit

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // API de Xposed/LSPosed (rovo89) — solo para compilar, no se empaqueta en el APK.
    compileOnly files('libs/api-82.jar')
}
